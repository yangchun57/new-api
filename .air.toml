root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/new-api-dev.exe ."
  bin = "./tmp/new-api-dev.exe"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "web", "docs", "release", "bin", "logs", "node_modules", ".git"]
  exclude_regex = ["_test\\.go$", "web/", "docs/", "release/", "bin/"]
  exclude_unchanged = false
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true
